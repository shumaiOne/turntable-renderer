name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_and_test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and Format Check (Biome)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  docker_build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t turntable-renderer:ci -f docker/Dockerfile .

      - name: Start container
        run: |
          docker run -d --name tr-app -p 3000:3000 turntable-renderer:ci
          sleep 3

      - name: Smoke test endpoints
        run: |
          echo "Testing /health..."
          curl -sf http://localhost:3000/health
          echo ""
          echo "Testing /version..."
          curl -sf http://localhost:3000/version
          echo ""

      - name: Stop container
        if: always()
        run: docker stop tr-app || true
